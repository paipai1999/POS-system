name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the code. Say so explicitly, so the job's token can never write to the repository,
# whatever the repository's default is and whoever's pull request is being tested.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The Windows setup script can only be tried on Windows. /check only looks at the PC and changes nothing.
      - name: Windows setup script (check only)
        if: runner.os == 'Windows'
        shell: cmd
        run: call setup-shop.bat /check
